AWSTemplateFormatVersion: "2010-09-09"
Description: EventBridge schedule for the Joy Inbox lease-aware automation queue worker.

Parameters:
  AutomationWorkerLambdaArn:
    Type: String
    Description: ARN of the deployed Lambda whose handler is src/automationWorker.handler.

Resources:
  AutomationWorkerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: joy-inbox-automation-worker-every-minute
      Description: Processes due tenant automation queue jobs with leases and uncertain-delivery safeguards.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: JoyInboxAutomationWorker
          Arn: !Ref AutomationWorkerLambdaArn

  AllowEventBridgeInvokeAutomationWorker:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutomationWorkerLambdaArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AutomationWorkerSchedule.Arn

Outputs:
  AutomationWorkerScheduleArn:
    Description: EventBridge rule ARN. Deploy after the automation worker Lambda is configured.
    Value: !GetAtt AutomationWorkerSchedule.Arn
